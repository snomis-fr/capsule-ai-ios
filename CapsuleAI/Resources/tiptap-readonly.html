<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; padding: 0; background: transparent; color: #1d1d1f; }
    #editor { background: transparent; min-height: 1px; color: #1d1d1f; }
    .ProseMirror {
      color: #1d1d1f !important;
      background: transparent !important;
      min-height: 1px;
      padding: 0;
      outline: none;
    }
    .ProseMirror p, .ProseMirror li { color: #1d1d1f !important; }
    .ProseMirror h1, .ProseMirror h2, .ProseMirror h3 { color: #1d1d1f !important; margin: 0.75em 0 0.25em; }
    .ProseMirror mark { padding: 0 2px; border-radius: 2px; }
    .ProseMirror a { color: #3B82F6; text-decoration: underline; }
    .ProseMirror code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px; font-size: 0.9em; }
    .ProseMirror ul, .ProseMirror ol { padding-left: 1.5em; }
    .ProseMirror table { border-collapse: collapse; width: 100%; }
    .ProseMirror td, .ProseMirror th { border: 1px solid #e2e8f0; padding: 8px; }
    .ProseMirror blockquote { border-left: 4px solid #e2e8f0; padding-left: 16px; margin-left: 0; color: #64748b; }
    .ProseMirror hr { border: none; border-top: 2px solid #e2e8f0; margin: 16px 0; }
    .ProseMirror pre { background: #f1f5f9; padding: 12px; border-radius: 4px; overflow-x: auto; }
    .ProseMirror pre code { background: none; padding: 0; }
    .ProseMirror .task-item { display: flex; align-items: flex-start; gap: 8px; }
    .ProseMirror .task-item[data-checked="true"] { text-decoration: line-through; color: #94a3b8; }
    .ProseMirror .youtube-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .ProseMirror .youtube-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .ProseMirror img { max-width: 100%; height: auto; display: block; border-radius: 8px; }
  </style>
</head>
<body>
<div id="editor"></div>
<script>
  window.decodeBase64Utf8 = (b64) => {
    const binary = atob(b64)
    const bytes = new Uint8Array(binary.length)
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
    return new TextDecoder('utf-8').decode(bytes)
  }
</script>
<!-- CDN Skypack (plus stable que esm.sh) : pré-bundles avec dépendances -->
<script type="module">
  import { Editor } from 'https://cdn.skypack.dev/@tiptap/core@2.10.0'
  import StarterKit from 'https://cdn.skypack.dev/@tiptap/starter-kit@2.10.0'
  import Image from 'https://cdn.skypack.dev/@tiptap/extension-image@2.10.0'
  import Highlight from 'https://cdn.skypack.dev/@tiptap/extension-highlight@2.10.0'
  import Link from 'https://cdn.skypack.dev/@tiptap/extension-link@2.10.0'
  import TextStyle from 'https://cdn.skypack.dev/@tiptap/extension-text-style@2.10.0'
  import Color from 'https://cdn.skypack.dev/@tiptap/extension-color@2.10.0'
  import TaskList from 'https://cdn.skypack.dev/@tiptap/extension-task-list@2.10.0'
  import TaskItem from 'https://cdn.skypack.dev/@tiptap/extension-task-item@2.10.0'
  import Table from 'https://cdn.skypack.dev/@tiptap/extension-table@2.10.0'
  import TableRow from 'https://cdn.skypack.dev/@tiptap/extension-table-row@2.10.0'
  import TableCell from 'https://cdn.skypack.dev/@tiptap/extension-table-cell@2.10.0'
  import TableHeader from 'https://cdn.skypack.dev/@tiptap/extension-table-header@2.10.0'
  import YouTube from 'https://cdn.skypack.dev/@tiptap/extension-youtube@2.10.0'

  const editor = new Editor({
    element: document.querySelector('#editor'),
    extensions: [
      StarterKit,
      Image,
      Link,
      TextStyle,
      Color,
      Highlight.configure({ multicolor: true }),
      TaskList,
      TaskItem.configure({ nested: true }),
      Table.configure({ resizable: false }),
      TableRow,
      TableHeader,
      TableCell,
      YouTube.configure({
        inline: false,
        HTMLAttributes: { referrerpolicy: 'strict-origin-when-cross-origin' }
      })
    ],
    content: '',
    editable: false,
    editorProps: { attributes: { class: 'ProseMirror', style: 'min-height: 1px; padding: 0;' } }
  })

  window.setTiptapReadOnlyContent = (json) => {
    try { editor.commands.setContent(json) } catch (_) {}
  }
  window.reportTiptapReadOnlyHeight = () => {
    const report = () => {
      const el = document.querySelector('.ProseMirror')
      const h = el ? Math.ceil(el.scrollHeight) + 8 : 44
      if (window.webkit?.messageHandlers?.tiptapReadOnlyHeight) {
        window.webkit.messageHandlers.tiptapReadOnlyHeight.postMessage(h)
      }
    }
    requestAnimationFrame(() => requestAnimationFrame(report))
  }
</script>
</body>
</html>
